<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .wall { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ground { stroke: #334155; stroke-width: 4; }
    .counter { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .front { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .equip { fill: #ffffff; stroke: #1e293b; stroke-width: 1.4; }
    .todo { fill: #ffffff; stroke: #1e293b; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .person { fill: #94a3b8; }
    .dim { stroke: #0f172a; stroke-width: 1; }
    .sight { fill: none; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 7 5; }
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .label { font-size: 12px; fill: #1e293b; }
    .note { font-size: 11px; fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .wall { fill: #1e293b; stroke: #475569; }
      .ground { stroke: #cbd5e1; }
      .counter { fill: #2a2148; }
      .front { fill: #14301d; }
      .equip, .todo { fill: #0f172a; stroke: #e2e8f0; }
      .person { fill: #64748b; }
      .dim { stroke: #e2e8f0; }
      .title, .label { fill: #f1f5f9; }
      .note { fill: #cbd5e1; }
    }
  </style>

  <rect class="bg" width="1000" height="540" />
  <text class="title" x="30" y="28">顧客視角：站在點餐位置看吧台</text>
  <text class="note" x="30" y="46">示意圖，非等比例；標註高度為常見值，現場量測後替換</text>

  <!-- 後牆與天花 -->
  <rect class="wall" x="140" y="108" width="810" height="322" />
  <line class="dim" x1="140" y1="108" x2="950" y2="108" />
  <text class="note" x="826" y="102">天花高度待量</text>

  <!-- 地面 -->
  <line class="ground" x1="30" y1="430" x2="970" y2="430" />

  <!-- 後方工作檯（0.9m） -->
  <rect class="counter" x="330" y="326" width="560" height="104" />

  <!-- 咖啡設備 -->
  <rect class="equip" x="354" y="254" width="28" height="72" />
  <text class="label" x="338" y="247">磨豆機</text>
  <rect class="todo" x="399" y="300" width="60" height="26" />
  <text class="note" x="404" y="294">填壓</text>
  <rect class="equip" x="467" y="263" width="92" height="63" />
  <text class="label" x="479" y="256">咖啡機</text>
  <rect class="todo" x="567" y="292" width="56" height="34" />
  <text class="note" x="574" y="286">牛奶</text>

  <!-- 杯具層架 -->
  <rect class="todo" x="345" y="211" width="278" height="12" />
  <text class="note" x="350" y="205">杯具層架</text>

  <!-- 冷飲設備 -->
  <rect class="equip" x="650" y="281" width="58" height="45" />
  <text class="label" x="650" y="274">果汁機</text>
  <rect class="equip" x="716" y="246" width="40" height="80" />
  <text class="label" x="762" y="290">製冰機</text>

  <!-- 工作人員（站在吧台後方，下半身被吧台遮住） -->
  <g class="person">
    <circle cx="305" cy="252" r="16" />
    <rect x="287" y="272" width="36" height="58" rx="10" />
  </g>
  <text class="note" x="272" y="240">工作人員</text>

  <!-- 吧台前緣（1.1m）與較低的出餐段（0.9m） -->
  <rect class="front" x="140" y="326" width="140" height="104" />
  <text class="label" x="168" y="356">出餐檯</text>
  <text class="note" x="176" y="374">0.9m</text>
  <rect class="counter" x="280" y="303" width="670" height="127" />
  <text class="label" x="556" y="336">吧台前緣 1.1m</text>
  <text class="note" x="556" y="354">顧客側看不到檯面下的作業</text>

  <!-- 點餐螢幕 -->
  <rect class="todo" x="856" y="258" width="60" height="45" />
  <text class="label" x="850" y="320">點餐螢幕</text>

  <!-- 顧客 -->
  <g class="person">
    <circle cx="80" cy="252" r="16" />
    <rect x="62" y="272" width="36" height="158" rx="10" />
  </g>
  <text class="note" x="46" y="452">顧客 1.7m</text>

  <!-- 視線 -->
  <path class="sight" d="M 96 252 L 940 252" />
  <text class="note" x="104" y="244">顧客視線 1.55m</text>
  <text class="note" x="640" y="244">此線以上顧客都看得到：層架與機器頂部要收整齊</text>

  <!-- 尺寸線 -->
  <line class="dim" x1="120" y1="430" x2="120" y2="303" />
  <line class="dim" x1="114" y1="430" x2="126" y2="430" />
  <line class="dim" x1="114" y1="303" x2="126" y2="303" />
  <text class="note" x="126" y="372">1.1m</text>
  <line class="dim" x1="960" y1="430" x2="960" y2="211" />
  <line class="dim" x1="954" y1="430" x2="966" y2="430" />
  <line class="dim" x1="954" y1="211" x2="966" y2="211" />
  <text class="note" x="924" y="200">1.6m</text>

  <!-- 圖例與待確認 -->
  <rect class="equip" x="30" y="482" width="18" height="12" />
  <text class="note" x="54" y="492">購買清單內設備</text>
  <rect class="todo" x="180" y="482" width="18" height="12" />
  <text class="note" x="204" y="492">尚未採購／待確認</text>
  <text class="note" x="360" y="492">待確認：吧台高度與深度、層架下緣高度、天花高度、咖啡機與果汁機實際高度、機器朝向</text>
</svg>
